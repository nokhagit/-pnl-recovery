
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name pnl_recovery .

      - name: Configure Android SDK 36
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          updated = False

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text()

              patterns = [
                  (r"compileSdk\s*=\s*flutter\.compileSdkVersion",
                   "compileSdk = 36"),
                  (r"compileSdk\s+flutter\.compileSdkVersion",
                   "compileSdk 36"),
                  (r"compileSdk\s*=\s*\d+",
                   "compileSdk = 36"),
                  (r"compileSdk\s+\d+",
                   "compileSdk 36"),
              ]

              for pattern, replacement in patterns:
                  s, count = re.subn(pattern, replacement, s)
                  if count:
                      updated = True

              p.write_text(s)
              print("Checked:", p)

          if not updated:
              raise SystemExit(
                  "Could not update app compileSdk"
              )
          PYTHON

      - name: Set installed app name
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          s, count = re.subn(
              r'android:label="[^"]*"',
              'android:label="TRADE LEDGER"',
              s,
              count=1,
          )

          if not count:
              raise SystemExit("App label not found")

          p.write_text(s)
          print("App name: TRADE LEDGER")
          PYTHON

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fix file_picker Android SDK
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache"

          files = list(
              cache.glob(
                  "hosted/pub.dev/file_picker-*/android/build.gradle"
              )
          )

          files += list(
              cache.glob(
                  "hosted/pub.dev/file_picker-*/android/build.gradle.kts"
              )
          )

          if not files:
              raise SystemExit(
                  "file_picker Gradle file not found"
              )

          for p in files:
              s = p.read_text()

              patterns = [
                  (r"compileSdkVersion\s+\d+",
                   "compileSdkVersion 36"),
                  (r"compileSdk\s*=\s*\d+",
                   "compileSdk = 36"),
                  (r"compileSdk\s+\d+",
                   "compileSdk 36"),
              ]

              total = 0

              for pattern, replacement in patterns:
                  s, count = re.subn(
                      pattern, replacement, s
                  )
                  total += count

              if total == 0:
                  raise SystemExit(
                      f"compileSdk not found in {p}"
                  )

              p.write_text(s)
              print("Fixed:", p)
          PYTHON

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Ledger-V2.5-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
