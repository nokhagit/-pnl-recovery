name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: flutter create --platforms=android --project-name pnl_recovery .

      - name: Set Android compileSdk to 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts

      - name: Set installed app name
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="pnl_recovery"', 'android:label="TRADE LEDGER"')
          p.write_text(s)
          PYTHON

      - name: Install dependencies
        run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze lib --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trade-Ledger-V2.5-APK
          path: build/app/outputs/flutter-apk/app-release.apk
